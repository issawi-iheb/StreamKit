name: StreamKit CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run Swift package tests
        run: swift test

      - name: Run demo unit and UI tests
        run: >-
          xcodebuild -quiet
          -project Examples/StreamKitDemo/StreamKitDemo.xcodeproj
          -scheme StreamKitDemo
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -configuration Debug
          -derivedDataPath /tmp/StreamKitDerivedData
          CODE_SIGNING_ALLOWED=NO
          test
